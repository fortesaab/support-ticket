services:
  mysql:
    image: mysql:8.0
    container_name: support_ticket_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: support_ticket
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: support_ticket_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: laravel
      PMA_PASSWORD: secret

volumes:
  mysql_data:
    driver: local
